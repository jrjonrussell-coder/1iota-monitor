name: 1iota Daily Show monitor

on:
  schedule:
    - cron: '7 * * * *'        # hourly, offset off the hour
  workflow_dispatch:            # lets you run it manually to verify

permissions:
  contents: write
  issues: write

concurrency:
  group: 1iota-monitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      # Empty when the secrets are not configured. Used to skip the SMTP steps.
      MAIL_CONFIGURED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@latest >/dev/null
          npx playwright install --with-deps chromium

      - name: Sweep 1iota
        id: sweep
        run: node scripts/check-1iota.mjs

      # Zero-configuration alert. GitHub emails you when an issue is opened
      # in a repo you watch, so this works with no secrets at all.
      - name: Open issue on availability
        if: steps.sweep.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "TICKETS AVAILABLE: The Daily Show, 19 to 25 October 2026" \
            --body-file summary.txt

      - name: Email on availability
        if: steps.sweep.outputs.notify == 'true' && env.MAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 1iota monitor
          to: jr.jonrussell@gmail.com
          subject: 'ALERT: The Daily Show tickets available, 19 to 25 October 2026'
          body: file://summary.txt

      - name: Email on change only
        if: steps.sweep.outputs.notify != 'true' && steps.sweep.outputs.changed == 'true' && env.MAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 1iota monitor
          to: jr.jonrussell@gmail.com
          subject: '1iota Daily Show: calendar changed'
          body: file://summary.txt

      - name: Email on sweep failure
        if: failure() && env.MAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 1iota monitor
          to: jr.jonrussell@gmail.com
          subject: '1iota monitor: sweep failed'
          body: 'The hourly 1iota sweep failed. Check the workflow run log. Silence from this monitor must not be read as no tickets.'

      - name: Commit state
        run: |
          git config user.name  "1iota-monitor"
          git config user.email "actions@github.com"
          git add state/1iota-state.json
          git diff --staged --quiet || git commit -m "sweep $(date -u +%FT%TZ)"
          git push
